<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Sena | Fans</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0e0e0e;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .header {
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #222;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 15px;
    }

    .video-card {
      background: #181818;
      border-radius: 12px;
      overflow: hidden;
    }

    .video-info {
      padding: 10px;
    }

    .loader {
      text-align: center;
      padding: 20px;
      display: none;
    }

    /* Plyr customization */
    .plyr {
      --plyr-color-main: #ff0055;
      --plyr-video-control-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
    }

    /* Убираем эффект нажатия (ripple/active) на кнопках плеера */
    .plyr__control:focus,
    .plyr__control:focus-visible {
      outline: none !important;
      box-shadow: none !important;
    }

    .plyr__control::after,
    .plyr__control::before {
      display: none !important;
    }

    .plyr__control:active {
      transform: none !important;
      box-shadow: none !important;
      background: transparent !important;
      opacity: 1 !important;
    }

    /* Убираем ripple-эффект у кнопки play-large */
    .plyr__control--overlaid:active,
    .plyr__control--overlaid:focus {
      transform: none !important;
      box-shadow: none !important;
      outline: none !important;
    }

    /* Убираем эффект при нажатии на прогресс-бар */
    .plyr__progress input[type=range]::-webkit-slider-thumb:active {
      box-shadow: none !important;
    }

    /* Отключаем выделение текста/элементов при клике */
    .plyr {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Sakura Sena</h1>
    </header>

    <main id="feed" class="feed"></main>
    <div id="loader" class="loader">Загрузка...</div>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    const feed = document.getElementById('feed');
    const loader = document.getElementById('loader');

    let loading = false;
    let allVideosLoaded = false;

    const videos = [
      { title: "Big Buck Bunny", url: "https://videotourl.com/videos/1776258938636-84af6068-252d-4857-bf60-c7841625d5b1.mp4" },
      { title: "Sample Video", url: "https://videotourl.com/videos/1774408888308-289df404-1679-4bd5-b8ca-c802e53cab99.mp4" }
    ];

    // Хранилище экземпляров Plyr
    const players = [];

    function createVideo(videoData) {
      const card = document.createElement('div');
      card.className = 'video-card';

      const wrapper = document.createElement('div');
      wrapper.className = 'plyr__video-wrapper';

      const video = document.createElement('video');
      video.setAttribute('playsinline', '');
      video.setAttribute('preload', 'metadata');

      const source = document.createElement('source');
      source.src = videoData.url;
      source.type = 'video/mp4';

      video.appendChild(source);

      const info = document.createElement('div');
      info.className = 'video-info';
      info.innerHTML = `<h3>${videoData.title}</h3>`;

      card.appendChild(video);
      card.appendChild(info);

      return { card, video };
    }

    function initPlayer(videoEl) {
      const player = new Plyr(videoEl, {
        controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
        resetOnEnd: false,
        clickToPlay: true,
        disableContextMenu: false,
        keyboard: { focused: true, global: false },
        tooltips: { controls: false, seek: true },
      });

      // При воспроизведении — ставим все остальные на паузу
      player.on('play', () => {
        players.forEach(p => {
          if (p !== player && !p.paused) {
            p.pause();
          }
        });
      });

      players.push(player);
      return player;
    }

    async function loadVideos() {
      if (loading || allVideosLoaded) return;

      loading = true;
      loader.style.display = 'block';

      await new Promise(resolve => setTimeout(resolve, 1000));

      if (videos.length === 0) {
        allVideosLoaded = true;
        loader.style.display = 'none';
        loading = false;
        return;
      }

      videos.forEach(videoData => {
        const { card, video } = createVideo(videoData);
        feed.appendChild(card);
        // Инициализируем Plyr сразу после добавления в DOM
        initPlayer(video);
      });

      allVideosLoaded = true;
      loader.style.display = 'none';
      loading = false;
    }

    window.addEventListener('scroll', () => {
      if (allVideosLoaded) return;

      const scrollBottom = window.innerHeight + window.scrollY;
      const pageBottom = document.body.offsetHeight - 200;

      if (scrollBottom >= pageBottom) {
        loadVideos();
      }
    });

    loadVideos();
  </script>
</body>
</html>
